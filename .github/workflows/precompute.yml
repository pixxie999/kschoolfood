name: Precompute Recipes

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 KST 자정 (UTC 15:00)
  workflow_dispatch:

jobs:
  precompute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests cryptography

      # 1단계: NEIS 7일치 메뉴 수집 → 구글 시트 신규 행 추가
      - name: Collect menus from NEIS → Google Sheet
        run: python scripts/collect_menus.py
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          OFFICE_CODE: K10
          SCHOOL_CODE: '7801106'
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}

      # 2단계: 구글 시트 전체 → D1 반영 (영어명, 재료, 조리법, 이미지)
      - name: Sync Google Sheet → D1
        run: python scripts/sync_sheet_to_d1.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      # 3단계: Claude Haiku Batch API로 레시피 자동 태깅 (category + tags)
      # --mode both: 전날 결과 수거 → 오늘 미태깅 레시피 제출
      - name: Auto-tag recipes with Claude Haiku Batch API
        run: python scripts/batch_tag_recipes.py --mode both
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      # 4단계: D1에만 있고 시트에 없는 레시피 → 시트에 추가
      - name: Sync D1 → Google Sheet (missing recipes)
        run: python scripts/sync_d1_to_sheet.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      # pending_tag_batches.json 변경 시 커밋 (batch_id 추적용)
      - name: Commit pending batch tracking file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kschoolfood/scripts/pending_tag_batches.json
          git diff --staged --quiet || git commit -m "chore: update pending_tag_batches.json [skip ci]"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
