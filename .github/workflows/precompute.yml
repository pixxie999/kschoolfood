name: Precompute Recipes

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 KST 자정 (UTC 15:00)
  workflow_dispatch:

jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests cryptography

      # 1단계: NEIS 7일치 메뉴 수집 → 구글 시트 신규 행 추가
      - name: Collect menus from NEIS → Google Sheet
        run: python scripts/collect_menus.py
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          OFFICE_CODE: K10
          SCHOOL_CODE: '7801106'
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}

      # 2단계: 구글 시트 전체 → D1 반영 (영어명, 재료, 조리법, 이미지)
      - name: Sync Google Sheet → D1
        run: python scripts/sync_sheet_to_d1.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
